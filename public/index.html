<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情侣小游戏</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">

    <!-- ====== 首页 ====== -->
    <div id="lobby" class="screen active">
      <div class="hero">
        <div class="logo">💞</div>
        <h1>异地情侣小游戏</h1>
        <p class="subtitle">选一个游戏，两个人一起玩</p>
      </div>

      <div class="tabs tabs-3">
        <button class="tab active" data-tab="create">创建房间</button>
        <button class="tab" data-tab="join">加入房间</button>
      </div>

      <div id="tab-create" class="tab-content active">
        <div class="input-group">
          <label>你的昵称</label>
          <input id="create-nickname" type="text" placeholder="你的昵称" maxlength="10">
        </div>
        <div class="input-group">
          <label>房间名</label>
          <input id="room-name" type="text" placeholder="比如：甜蜜小屋" maxlength="20">
        </div>

        <label class="input-group-label">选一个游戏</label>
        <div class="game-mode-grid" id="game-mode-picker"></div>

        <div id="quiz-theme-area">
          <label class="input-group-label">默契挑战 · 主题包</label>
          <div class="theme-grid" id="theme-picker"></div>
        </div>

        <div class="input-group" id="api-key-group" style="display:none;">
          <label>DeepSeek API Key <span class="label-hint">（AI 出题需要）</span></label>
          <input id="api-key-input" type="password" placeholder="sk-..." maxlength="60">
        </div>
        <button id="btn-create" class="btn-primary">创建房间</button>
      </div>

      <div id="tab-join" class="tab-content">
        <div class="input-group">
          <label>房间码</label>
          <input id="join-room-id" type="text" placeholder="输入 6 位房间码" maxlength="6"
            style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:1.2em;">
        </div>
        <div class="input-group">
          <label>你的昵称</label>
          <input id="join-nickname" type="text" placeholder="你的昵称" maxlength="10">
        </div>
        <button id="btn-join" class="btn-primary">加入房间</button>
      </div>
    </div>

    <!-- ====== 等待室 ====== -->
    <div id="waiting" class="screen">
      <div class="room-header">
        <div class="room-badge">房间 <span id="waiting-room-id"></span></div>
        <h2 id="waiting-room-name"></h2>
        <div class="tags">
          <span class="theme-tag" id="waiting-game-tag"></span>
          <span class="theme-tag" id="waiting-theme-tag"></span>
        </div>
      </div>
      <div class="waiting-content">
        <p class="waiting-hint">把房间码发给 TA，一起进来吧～</p>
        <div class="player-list">
          <div class="player-card" id="player-card-host">
            <div class="player-avatar">🐱</div>
            <div class="player-name" id="waiting-player1">...</div>
            <div class="player-status ready">已就位</div>
          </div>
          <div class="vs-big">VS</div>
          <div class="player-card empty" id="player-card-guest">
            <div class="player-avatar">❓</div>
            <div class="player-name" id="waiting-player2">等待中...</div>
            <div class="player-status">等待加入</div>
          </div>
        </div>
        <button id="btn-start" class="btn-primary" disabled>等待 TA 加入...</button>
      </div>
    </div>

    <!-- ====== 默契挑战 - 答题中 ====== -->
    <div id="quiz-playing" class="screen">
      <div class="round-bar">
        <span class="round-num">第 <span id="round-num">1</span> / <span id="round-total">5</span> 题</span>
        <span class="round-cat" id="round-cat"></span>
      </div>
      <div class="question-card">
        <div class="question-label" id="question-label">默契问答</div>
        <div class="challenge-emoji" id="challenge-emoji" style="display:none;"></div>
        <h3 id="question-text"></h3>
      </div>
      <div id="choice-options" class="options-grid"></div>
      <div id="fill-answer" style="display:none;">
        <textarea id="fill-input" placeholder="写下你的答案..." maxlength="200"></textarea>
        <button id="btn-submit-fill" class="btn-primary">提交答案</button>
      </div>
      <div class="answer-status">
        <span class="status-badge" id="status-me">👤 你：等待中</span>
        <span class="status-badge" id="status-partner">❤️ TA：等待中</span>
      </div>
    </div>

    <!-- ====== 默契挑战 - 结果 ====== -->
    <div id="quiz-result" class="screen">
      <div class="result-reveal" id="result-reveal">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-text" id="result-text"></div>
      </div>
      <div class="answer-cards">
        <div class="answer-card"><div class="answer-card-label">🐱</div><div class="answer-card-nickname" id="result-nickname1"></div><div class="answer-card-text" id="result-answer1"></div></div>
        <div class="answer-card"><div class="answer-card-label">🐶</div><div class="answer-card-nickname" id="result-nickname2"></div><div class="answer-card-text" id="result-answer2"></div></div>
      </div>
      <div class="ai-commentary" id="ai-commentary" style="display:none;"><div class="ai-commentary-header">🤖 AI 点评</div><div class="ai-commentary-text" id="ai-commentary-text"></div></div>
      <button id="btn-next-quiz" class="btn-primary">下一题</button>
    </div>

    <!-- ====== 默契挑战 - 终局 ====== -->
    <div id="quiz-finished" class="screen">
      <div class="hero"><div class="logo" id="finish-emoji">🎉</div><h1>挑战结束！</h1><p class="subtitle" id="verdict-text"></p></div>
      <div class="score-board" id="score-board"></div>
      <div class="ai-summary" id="ai-summary" style="display:none;"><div class="ai-summary-header">🤖 AI 写给你们的信</div><div class="ai-summary-text" id="ai-summary-text"></div></div>
      <div class="review-section"><h3 class="review-title">📋 本局回顾</h3><div id="review-list"></div></div>
      <button id="btn-again-quiz" class="btn-primary">再玩一局</button>
      <button id="btn-back-quiz" class="btn-secondary">返回首页</button>
    </div>

    <!-- ====== 故事接龙 ====== -->
    <div id="story-playing" class="screen">
      <div class="round-bar"><span class="round-num">第 <span id="story-round">1</span> / <span id="story-total">6</span> 句</span><span class="round-cat">📝 故事接龙</span></div>
      <div class="story-panel" id="story-scroll">
        <div class="story-prompt" id="story-prompt-text"></div>
        <div id="story-lines"></div>
      </div>
      <div class="story-input-area">
        <div id="story-turn-hint"></div>
        <textarea id="story-input" placeholder="续写下一句..." maxlength="150" disabled></textarea>
        <button id="btn-submit-story" class="btn-primary" disabled>提交</button>
        <div class="story-waiting" id="story-waiting">等待 TA 写下一句...</div>
      </div>
    </div>

    <!-- ====== 故事接龙 - 完成 ====== -->
    <div id="story-finished" class="screen">
      <div class="hero"><div class="logo">✨</div><h1>故事完成！</h1><p class="subtitle">这是你们一起写的故事 💕</p></div>
      <div class="story-full" id="story-full"></div>
      <button id="btn-again-story" class="btn-primary">再来一篇</button>
      <button id="btn-back-story" class="btn-secondary">返回首页</button>
    </div>

    <!-- ====== 愿望清单 - 进行中 ====== -->
    <div id="wishlist-playing" class="screen">
      <div class="round-bar"><span class="round-num">第 <span id="wl-round">1</span> / <span id="wl-total">5</span> 项</span><span class="round-cat">📋 愿望清单</span></div>
      <div class="question-card">
        <div class="question-label">写下你们的愿望</div>
        <h3 id="wl-prompt-text"></h3>
      </div>
      <textarea id="wl-input" placeholder="写下你的愿望..." maxlength="150"></textarea>
      <button id="btn-submit-wish" class="btn-primary">提交愿望</button>
      <div class="answer-status">
        <span class="status-badge" id="wl-status-me">👤 你：等待中</span>
        <span class="status-badge" id="wl-status-partner">❤️ TA：等待中</span>
      </div>
    </div>

    <!-- ====== 愿望清单 - 揭晓 ====== -->
    <div id="wishlist-reveal" class="screen">
      <div class="result-reveal"><div class="result-icon">💕</div><div class="result-text" id="wl-reveal-title">看看 TA 的愿望</div></div>
      <div class="wish-cards"><div class="wish-card"><div class="wish-card-label">🐱</div><div class="wish-card-name" id="wl-name1"></div><div class="wish-card-text" id="wl-text1"></div></div><div class="wish-card"><div class="wish-card-label">🐶</div><div class="wish-card-name" id="wl-name2"></div><div class="wish-card-text" id="wl-text2"></div></div></div>
      <button id="btn-next-wish" class="btn-primary">下一项</button>
    </div>

    <!-- ====== 愿望清单 - 完成 ====== -->
    <div id="wishlist-finished" class="screen">
      <div class="hero"><div class="logo">📋</div><h1>愿望清单完成！</h1><p class="subtitle">攒着，等见面一个一个完成 💕</p></div>
      <div id="wl-list"></div>
      <button id="btn-again-wish" class="btn-primary">再来一局</button>
      <button id="btn-back-wish" class="btn-secondary">返回首页</button>
    </div>

    <div id="toast" class="toast"></div>
    <div id="confetti-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
