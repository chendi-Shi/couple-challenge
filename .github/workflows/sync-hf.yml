name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Space
        run: |
          git remote add hf https://fall2028:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/fall2028/couple-game
          git push hf main --force
